name: Tests

# Runs on every pull request (and on demand): type check, unit tests and end-to-end
# tests of the production build as a phone (Chromium) and in Firefox.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Download DGT data
        run: bun scripts/update-dgt-data.ts

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
