name: Deploy to GitHub Pages

# Builds and publishes the app when its code changes (push to main) or on demand.
# The DGT data is refreshed by a separate, much lighter workflow (data.yml) that writes
# to the `data` branch; the app reads it from there. A copy of that data is also bundled
# with the site at build time, as the reserve the app falls back to if the branch cannot
# be read.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check and unit tests
        run: bun run lint && bun run test

      # Reserve copy of the data: the data branch as it is now, or the DGT directly while
      # that branch does not exist yet (first deployment)
      - name: Data bundled with the site
        run: |
          mkdir -p public/data
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C public/data
            rm -f public/data/README.md
          else
            HISTORY_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/history.json" bun scripts/update-dgt-data.ts
          fi
          ls -l public/data

      - name: Build
        run: bun run build
        env:
          # Where the app reads the fresh data from (the `data` branch of this repository)
          VITE_DATA_BASE: https://raw.githubusercontent.com/${{ github.repository }}/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
