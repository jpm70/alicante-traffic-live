name: Deploy to GitHub Pages

# Publishes the app and refreshes the official DGT incidents (data/alerts.json).
# The DGT feed does not allow browser requests, so it is downloaded here every
# 15 minutes and published with the site. GitHub may delay scheduled runs a few
# minutes, and pauses them after 60 days without activity in the repository.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check and unit tests
        run: bun run lint && bun run test

      - name: Download DGT incidents and speed cameras
        run: bun scripts/update-dgt-data.ts

      - name: Build
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
