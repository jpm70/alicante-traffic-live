        window.addEventListener('load', function () {

    <script>
      // Gracefully ignore Vite HMR / ModuleRunner WebSocket connection disconnects in iframe/proxy environment
      window.addEventListener('error', function (e) {
        var msg = String(e?.message || '');
        var src = String(e?.filename || '');
        var stack = String(e?.error?.stack || '');
        var full = msg + ' ' + src + ' ' + stack;
        if (full.includes('WebSocket') || full.includes('@vite/client') || full.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var str = String(e?.reason?.message || '') + ' ' + String(e?.reason || '') + ' ' + String(e?.reason?.stack || '');
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
