<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0b0f17; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="1200" height="675" fill="url(#bgGrad)" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="54" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <circle cx="25" cy="27" r="6" fill="#ef4444" />
  <circle cx="45" cy="27" r="6" fill="#f59e0b" />
  <circle cx="65" cy="27" r="6" fill="#10b981" />
  <text x="95" y="32" fill="#38bdf8" font-size="14" font-weight="bold">🚦 ALICANTE TRÁFICO EN VIVO</text>
  <rect x="300" y="14" width="220" height="26" rx="6" fill="#1e293b" />
  <text x="315" y="31" fill="#94a3b8" font-size="11">🔍 Buscar en 159 cámaras...</text>
  
  <!-- Header Tabs -->
  <rect x="540" y="14" width="90" height="26" rx="6" fill="#06b6d4" />
  <text x="560" y="31" fill="#020617" font-size="11" font-weight="bold">🗺️ Mapa</text>
  <rect x="640" y="14" width="90" height="26" rx="6" fill="#1e293b" />
  <text x="655" y="31" fill="#94a3b8" font-size="11">📹 Muro (159)</text>
  <rect x="740" y="14" width="130" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
  <text x="752" y="31" fill="#fbbf24" font-size="11" font-weight="bold">🚖 Transp. Público</text>
  <rect x="880" y="14" width="100" height="26" rx="6" fill="#10b981" />
  <text x="895" y="31" fill="#020617" font-size="11" font-weight="bold">🧭 Navegar GPS</text>

  <!-- Left Sidebar (Route Planner) -->
  <rect x="0" y="54" width="360" height="621" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  
  <!-- Sidebar Header -->
  <rect x="15" y="70" width="330" height="34" rx="8" fill="#1e293b" />
  <text x="35" y="92" fill="#38bdf8" font-size="12" font-weight="bold">📍 Planificador de Ruta Inteligente</text>
  
  <!-- Origin / Destination Inputs -->
  <g transform="translate(15, 115)">
    <rect x="0" y="0" width="330" height="42" rx="8" fill="#020617" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="21" r="6" fill="#10b981" />
    <text x="38" y="18" fill="#64748b" font-size="10">ORIGEN</text>
    <text x="38" y="32" fill="#f8fafc" font-size="12" font-weight="600">Plaza de los Luceros, Centro</text>

    <rect x="0" y="50" width="330" height="42" rx="8" fill="#020617" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="71" r="6" fill="#ef4444" />
    <text x="38" y="68" fill="#64748b" font-size="10">DESTINO</text>
    <text x="38" y="82" fill="#f8fafc" font-size="12" font-weight="600">Playa de San Juan (Av. Niza)</text>
  </g>

  <!-- Route Comparison Cards -->
  <g transform="translate(15, 220)">
    <!-- Active Route 1 -->
    <rect x="0" y="0" width="330" height="95" rx="10" fill="#020617" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
    <text x="16" y="24" fill="#06b6d4" font-size="13" font-weight="bold">Ruta 1: Vía Rápida por Av. Dénia</text>
    <rect x="235" y="10" width="80" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2" />
    <text x="245" y="24" fill="#38bdf8" font-size="10" font-weight="bold">MÁS RÁPIDA</text>
    <text x="16" y="56" fill="#f8fafc" font-size="24" font-weight="800">14 min</text>
    <text x="115" y="56" fill="#94a3b8" font-size="14">· 7.8 km · 🟢 Fluido</text>
    <text x="16" y="78" fill="#64748b" font-size="11">📹 6 Cámaras DGT · 🚌 Carril Bus-Taxi</text>

    <!-- Alternative Route 2 -->
    <rect x="0" y="105" width="330" height="75" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="16" y="128" fill="#e2e8f0" font-size="12" font-weight="bold">Ruta 2: Por Canalejas y Av. Villajoyosa</text>
    <text x="16" y="154" fill="#f59e0b" font-size="18" font-weight="700">19 min</text>
    <text x="85" y="154" fill="#94a3b8" font-size="12">· 8.4 km · 🟡 Tráfico moderado</text>

    <!-- Alternative Route 3 -->
    <rect x="0" y="190" width="330" height="75" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="16" y="213" fill="#e2e8f0" font-size="12" font-weight="bold">Ruta 3: Por Gran Vía interior</text>
    <text x="16" y="239" fill="#ef4444" font-size="18" font-weight="700">22 min</text>
    <text x="85" y="239" fill="#94a3b8" font-size="12">· 9.2 km · 🔴 Retención semafórica</text>
  </g>

  <!-- Quick Action Buttons -->
  <g transform="translate(15, 510)">
    <rect x="0" y="0" width="158" height="38" rx="8" fill="#06b6d4" />
    <text x="25" y="24" fill="#020617" font-size="12" font-weight="bold">🎬 Street View Tour</text>

    <rect x="172" y="0" width="158" height="38" rx="8" fill="#10b981" />
    <text x="200" y="24" fill="#020617" font-size="12" font-weight="bold">📱 Modo GPS</text>

    <rect x="0" y="46" width="330" height="34" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
    <text x="65" y="68" fill="#fbbf24" font-size="12" font-weight="bold">💶 Taxímetro Oficial: 11,40 € (T1)</text>
  </g>

  <!-- Creator Badge Bottom -->
  <g transform="translate(15, 608)">
    <rect x="0" y="0" width="330" height="48" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1" />
    <text x="15" y="22" fill="#64748b" font-size="9" font-family="monospace">CREADO POR</text>
    <text x="15" y="38" fill="#38bdf8" font-size="12" font-weight="bold">unfantasmaenelsistema.com</text>
    <text x="260" y="30" fill="#94a3b8" font-size="11">🔗 Visitar ↗</text>
  </g>

  <!-- Right Map View Mockup -->
  <rect x="360" y="54" width="840" height="621" fill="#0b1120" />
  
  <!-- Map Roads and Coastline representation -->
  <!-- Sea / Mediterranean Coast -->
  <path d="M 950 54 Q 920 200 900 350 T 820 675 L 1200 675 L 1200 54 Z" fill="#082f49" fill-opacity="0.6" />
  <text x="1000" y="400" fill="#0284c7" font-size="16" font-style="italic" letter-spacing="4">MAR MEDITERRÁNEO</text>
  <text x="980" y="425" fill="#38bdf8" font-size="12" font-weight="600">BAHÍA DE ALICANTE</text>

  <!-- Main City Grid Lines -->
  <path d="M 360 200 L 920 200" stroke="#1e293b" stroke-width="3" />
  <path d="M 360 380 L 860 380" stroke="#1e293b" stroke-width="3" />
  <path d="M 360 520 L 820 520" stroke="#1e293b" stroke-width="3" />
  <path d="M 520 54 L 520 675" stroke="#1e293b" stroke-width="3" />
  <path d="M 700 54 L 700 675" stroke="#1e293b" stroke-width="3" />

  <!-- A-70 / Vía Parque Ring Road -->
  <path d="M 400 54 Q 480 250 430 675" stroke="#334155" stroke-width="6" fill="none" />
  
  <!-- Calculated Route Line (Vía Av. Dénia to San Juan) -->
  <path d="M 480 380 Q 560 350 650 250 T 880 120" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)" />
  <path d="M 480 380 Q 560 350 650 250 T 880 120" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Alternative Route Line (Canalejas) -->
  <path d="M 480 380 Q 600 480 750 380 T 880 120" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6" stroke-opacity="0.8" fill="none" />

  <!-- Origin Marker (Luceros) -->
  <g transform="translate(480, 380)">
    <circle cx="0" cy="0" r="16" fill="#10b981" fill-opacity="0.3" filter="url(#glow)" />
    <circle cx="0" cy="0" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <rect x="-65" y="-35" width="130" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="0" y="-19" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">📍 PLAZA DE LUCEROS</text>
  </g>

  <!-- Destination Marker (San Juan) -->
  <g transform="translate(880, 120)">
    <circle cx="0" cy="0" r="16" fill="#ef4444" fill-opacity="0.3" filter="url(#glow)" />
    <circle cx="0" cy="0" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <rect x="-70" y="-35" width="140" height="24" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="0" y="-19" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">🏁 PLAYA DE SAN JUAN</text>
  </g>

  <!-- DGT Traffic Camera Markers on Route -->
  <g transform="translate(560, 335)">
    <circle cx="0" cy="0" r="12" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="4" font-size="10" text-anchor="middle">📹</text>
  </g>
  <g transform="translate(650, 250)">
    <circle cx="0" cy="0" r="12" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="4" font-size="10" text-anchor="middle">📹</text>
  </g>
  <g transform="translate(760, 180)">
    <circle cx="0" cy="0" r="12" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="4" font-size="10" text-anchor="middle">📹</text>
  </g>

  <!-- Official Taxi Stand Markers (🚖) -->
  <g transform="translate(520, 420)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24" stroke="#000000" stroke-width="2" />
    <text x="0" y="4" font-size="10" text-anchor="middle">🚖</text>
    <rect x="18" y="-10" width="105" height="20" rx="4" fill="#020617" stroke="#fbbf24" stroke-width="1" />
    <text x="25" y="4" fill="#fbbf24" font-size="9" font-weight="bold">Renfe AVE (18 pl.)</text>
  </g>
  <g transform="translate(620, 390)">
    <circle cx="0" cy="0" r="12" fill="#fbbf24" stroke="#000000" stroke-width="2" />
    <text x="0" y="4" font-size="10" text-anchor="middle">🚖</text>
    <rect x="18" y="-10" width="115" height="20" rx="4" fill="#020617" stroke="#fbbf24" stroke-width="1" />
    <text x="25" y="4" fill="#fbbf24" font-size="9" font-weight="bold">Mercado Central</text>
  </g>

  <!-- Floating Picture-in-Picture DGT Camera Box -->
  <g transform="translate(930, 440)">
    <rect x="0" y="0" width="240" height="190" rx="10" fill="#020617" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow)" />
    <!-- Header PiP -->
    <rect x="0" y="0" width="240" height="28" rx="10" fill="#0f172a" />
    <circle cx="15" cy="14" r="4" fill="#ef4444" />
    <text x="25" y="18" fill="#f8fafc" font-size="10" font-weight="bold">🔴 EN VIVO · DGT CAM #042</text>
    <text x="175" y="18" fill="#38bdf8" font-size="10">Av. Dénia</text>
    <!-- Camera Image Area -->
    <rect x="8" y="34" width="224" height="118" rx="6" fill="#1e293b" />
    <!-- Asphalt & Road Simulation -->
    <path d="M 8 130 L 120 70 L 232 130 Z" fill="#0f172a" />
    <line x1="120" y1="70" x2="120" y2="152" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
    <text x="120" y="80" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Tráfico Fluido (52 km/h)</text>
    <!-- Footer Telemetry -->
    <text x="15" y="172" fill="#94a3b8" font-size="10">Actualizado hace 3s · 159 cámaras activas</text>
  </g>
</svg>
