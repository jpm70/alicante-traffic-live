<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#000000; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Horizon -->
  <rect x="0" y="0" width="1200" height="420" fill="url(#skyGrad)" />
  
  <!-- Mediterranean Sun -->
  <circle cx="950" cy="90" r="45" fill="#fef08a" />
  <circle cx="950" cy="90" r="60" fill="#fef08a" fill-opacity="0.3" filter="url(#hudGlow)" />

  <!-- Santa Bárbara Castle silhouette in the distance -->
  <polygon points="560,320 620,240 680,210 740,240 820,320" fill="#cbd5e1" />
  <rect x="670" y="195" width="20" height="20" fill="#94a3b8" />
  <text x="680" y="185" fill="#64748b" font-size="11" font-weight="bold" text-anchor="middle">Castillo de Santa Bárbara</text>

  <!-- Palm trees on Avenida Maisonnave / Alfonso X -->
  <g transform="translate(180, 240)">
    <path d="M 40 100 Q 45 40 50 0" stroke="#78350f" stroke-width="8" fill="none" />
    <circle cx="50" cy="-5" r="35" fill="#15803d" />
  </g>
  <g transform="translate(240, 260)">
    <path d="M 40 80 Q 42 35 45 0" stroke="#78350f" stroke-width="7" fill="none" />
    <circle cx="45" cy="-5" r="28" fill="#16a34a" />
  </g>
  <g transform="translate(940, 250)">
    <path d="M 40 90 Q 36 38 35 0" stroke="#78350f" stroke-width="7" fill="none" />
    <circle cx="35" cy="-5" r="30" fill="#15803d" />
  </g>

  <!-- Buildings Perspective -->
  <polygon points="0,150 350,320 350,420 0,420" fill="#e2e8f0" stroke="#94a3b8" />
  <polygon points="850,320 1200,160 1200,420 850,420" fill="#f1f5f9" stroke="#cbd5e1" />

  <!-- Road & Asphalt Surface -->
  <polygon points="350,340 850,340 1200,675 0,675" fill="url(#roadGrad)" />
  
  <!-- BUS-TAXI RESERVED LANE (Right Lane) -->
  <polygon points="680,340 850,340 1200,675 880,675" fill="#1e293b" fill-opacity="0.8" />
  <line x1="680" y1="340" x2="880" y2="675" stroke="#ef4444" stroke-width="6" />
  <text x="960" y="580" fill="#f8fafc" font-size="28" font-weight="900" transform="rotate(35 960 580)" letter-spacing="8">BUS - TAXI</text>

  <!-- Center Lane Dashed Divider -->
  <line x1="570" y1="340" x2="520" y2="675" stroke="#ffffff" stroke-width="6" stroke-dasharray="30 20" />

  <!-- Car Hood / Windshield perspective overlay at bottom -->
  <path d="M 0 630 Q 600 590 1200 630 L 1200 675 L 0 675 Z" fill="#020617" stroke="#1e293b" stroke-width="2" />

  <!-- TOP COCKPIT: Official Alicante Street Sign & Turn Indicator -->
  <g transform="translate(40, 30)">
    <!-- Real Street Sign Box (Alicante Blue) -->
    <rect x="0" y="0" width="460" height="74" rx="10" fill="#0284c7" stroke="#ffffff" stroke-width="3" filter="url(#hudGlow)" />
    <!-- City Crest Icon / Badge -->
    <rect x="12" y="12" width="50" height="50" rx="6" fill="#0369a1" />
    <text x="37" y="44" font-size="26" text-anchor="middle">👑</text>
    <!-- Street Name Text -->
    <text x="76" y="34" fill="#ffffff" font-size="11" font-weight="900" letter-spacing="2">CIUDAD DE ALICANTE · CALLEJERO OFICIAL</text>
    <text x="76" y="58" fill="#ffffff" font-size="20" font-weight="900">Av. Maisonnave, 28 (Tramo Central)</text>
  </g>

  <!-- Maneuver Navigation Badge -->
  <g transform="translate(520, 30)">
    <rect x="0" y="0" width="340" height="74" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#06b6d4" stroke-width="2" />
    <text x="20" y="32" fill="#06b6d4" font-size="11" font-weight="bold">PRÓXIMA MANIOBRA EN 120 METROS</text>
    <text x="20" y="58" fill="#f8fafc" font-size="18" font-weight="800">↗ Continuar recto hacia Plaza Luceros</text>
  </g>

  <!-- Perspective Camera Angle Controls (0°, -45°, +45°, 180°) -->
  <g transform="translate(880, 30)">
    <rect x="0" y="0" width="280" height="74" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <text x="18" y="24" fill="#94a3b8" font-size="10" font-weight="bold">ÁNGULO DE VISIÓN (PANORAMA 360°)</text>
    <!-- Buttons -->
    <rect x="18" y="32" width="55" height="30" rx="6" fill="#06b6d4" />
    <text x="30" y="52" fill="#020617" font-size="11" font-weight="bold">Frente</text>

    <rect x="80" y="32" width="55" height="30" rx="6" fill="#1e293b" />
    <text x="96" y="52" fill="#94a3b8" font-size="11">Izq.</text>

    <rect x="142" y="32" width="55" height="30" rx="6" fill="#1e293b" />
    <text x="156" y="52" fill="#94a3b8" font-size="11">Dcha.</text>

    <rect x="204" y="32" width="60" height="30" rx="6" fill="#1e293b" />
    <text x="216" y="52" fill="#94a3b8" font-size="11">Atrás</text>
  </g>

  <!-- TELEMETRY HUD OVERLAY (Left Center) -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#020617" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.5" />
    <text x="16" y="26" fill="#06b6d4" font-size="11" font-weight="bold">TELEMETRÍA DE RUTA</text>
    
    <text x="16" y="58" fill="#f8fafc" font-size="32" font-weight="900">46</text>
    <text x="60" y="58" fill="#94a3b8" font-size="14">km/h</text>
    <rect x="120" y="38" width="85" height="24" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="128" y="54" fill="#34d399" font-size="10" font-weight="bold">🟢 BUS-TAXI</text>

    <line x1="16" y1="72" x2="204" y2="72" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="92" fill="#94a3b8" font-size="11">Progreso: <tspan fill="#f8fafc" font-weight="bold">3.2 / 7.8 km (41%)</tspan></text>
    <text x="16" y="112" fill="#94a3b8" font-size="11">Tiempo rest.: <tspan fill="#38bdf8" font-weight="bold">8 min</tspan></text>
    <text x="16" y="132" fill="#94a3b8" font-size="11">Rumbo: <tspan fill="#f8fafc" font-weight="bold">35° (NNE)</tspan></text>
  </g>

  <!-- MINI MAP OVERLAY WITH FOV VISION CONE (Right Bottom) -->
  <g transform="translate(920, 390)">
    <rect x="0" y="0" width="240" height="200" rx="12" fill="#020617" fill-opacity="0.9" stroke="#06b6d4" stroke-width="2" filter="url(#hudGlow)" />
    <!-- Header Mini Map -->
    <rect x="0" y="0" width="240" height="26" rx="12" fill="#0f172a" />
    <text x="12" y="18" fill="#38bdf8" font-size="10" font-weight="bold">🗺️ MINIMAPA DE TRAYECTO</text>
    <text x="185" y="18" fill="#94a3b8" font-size="9">Punto #14/32</text>
    <!-- Map Content -->
    <rect x="10" y="34" width="220" height="156" rx="6" fill="#0b1120" />
    <!-- Mini Route Line -->
    <path d="M 30 160 Q 90 120 120 90 T 200 40" stroke="#06b6d4" stroke-width="4" fill="none" />
    <!-- Vision Cone -->
    <polygon points="120,90 80,40 160,40" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Car Dot Marker -->
    <circle cx="120" cy="90" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <circle cx="120" cy="90" r="14" fill="#f59e0b" fill-opacity="0.3" />
    <!-- Camera Pins on Mini Map -->
    <circle cx="70" cy="135" r="4" fill="#ef4444" />
    <circle cx="160" cy="65" r="4" fill="#ef4444" />
  </g>

  <!-- PLAYBACK TIMELINE CONTROLLER (Center Bottom) -->
  <g transform="translate(240, 560)">
    <rect x="0" y="0" width="650" height="75" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5" />
    
    <!-- Timeline Track -->
    <rect x="25" y="20" width="600" height="8" rx="4" fill="#1e293b" />
    <!-- Progress Filled -->
    <rect x="25" y="20" width="250" height="8" rx="4" fill="#06b6d4" />
    <!-- Current Scrubber Thumb -->
    <circle cx="275" cy="24" r="8" fill="#ffffff" stroke="#06b6d4" stroke-width="3" filter="url(#hudGlow)" />
    
    <!-- Control Buttons -->
    <g transform="translate(25, 38)">
      <!-- Prev -->
      <rect x="0" y="0" width="32" height="26" rx="6" fill="#1e293b" />
      <text x="12" y="17" fill="#ffffff" font-size="12">⏮</text>
      <!-- Play/Pause -->
      <rect x="38" y="0" width="55" height="26" rx="6" fill="#06b6d4" />
      <text x="50" y="17" fill="#020617" font-size="11" font-weight="bold">⏸ Pausa</text>
      <!-- Next -->
      <rect x="100" y="0" width="32" height="26" rx="6" fill="#1e293b" />
      <text x="112" y="17" fill="#ffffff" font-size="12">⏭</text>
      <!-- Speed 1x, 2x -->
      <rect x="145" y="0" width="40" height="26" rx="6" fill="#1e293b" />
      <text x="153" y="17" fill="#38bdf8" font-size="11" font-weight="bold">1.5x</text>
      
      <!-- Waypoint coordinates & street text -->
      <text x="210" y="17" fill="#94a3b8" font-size="11">Waypoint: <tspan fill="#f8fafc" font-weight="bold">Maisonnave c/ Federico Soto</tspan> (38.3442° N, -0.4908° W)</text>
    </g>
  </g>
</svg>
