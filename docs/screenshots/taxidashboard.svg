<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#000000; font-family:'JetBrains Mono', -apple-system, monospace;">
  <defs>
    <linearGradient id="oledAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- OLED True Black Background -->
  <rect x="0" y="0" width="1200" height="675" fill="#000000" />
  
  <!-- Subtle Amber Grid Border for High Visibility -->
  <rect x="15" y="15" width="1170" height="645" rx="16" fill="#000000" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" />

  <!-- TOP STATUS BAR: VEHICLE & REGULATION HEADER -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="1130" height="50" rx="10" fill="#0a0a0a" stroke="#262626" stroke-width="1.5" />
    
    <rect x="15" y="10" width="160" height="30" rx="6" fill="#fbbf24" />
    <text x="95" y="30" fill="#000000" font-size="13" font-weight="900" text-anchor="middle">🚖 TAXI ALICANTE</text>

    <text x="195" y="31" fill="#fbbf24" font-size="13" font-weight="bold">MODO SALPICADERO OLED</text>
    <text x="390" y="31" fill="#737373" font-size="12">Licencia #418 · Área Prestación Conjunta</text>

    <!-- Carril Bus-Taxi Badge -->
    <rect x="740" y="10" width="170" height="30" rx="6" fill="#15803d" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="755" cy="25" r="5" fill="#22c55e" filter="url(#neonGlow)" />
    <text x="770" y="30" fill="#4ade80" font-size="11" font-weight="bold">CARRIL BUS-TAXI ACTIVO</text>

    <!-- Clock -->
    <text x="1030" y="32" fill="#fbbf24" font-size="18" font-weight="900" text-anchor="middle">14:32:45</text>
  </g>

  <!-- MAIN HUD LEFT: GIANT SPEEDOMETER & STREET (Optimized for Windshield Mount) -->
  <g transform="translate(35, 95)">
    <!-- Speed Box -->
    <rect x="0" y="0" width="360" height="260" rx="14" fill="#050505" stroke="#fbbf24" stroke-width="3" filter="url(#neonGlow)" />
    <text x="24" y="36" fill="#fbbf24" font-size="13" font-weight="bold" letter-spacing="1">VELOCIDAD GPS</text>
    
    <!-- Giant Digits -->
    <text x="180" y="165" fill="#ffffff" font-size="110" font-weight="900" text-anchor="middle">48</text>
    <text x="180" y="205" fill="#a3a3a3" font-size="20" font-weight="bold" text-anchor="middle">KM / H</text>
    
    <!-- Speed limit badge (50 km/h) -->
    <g transform="translate(265, 20)">
      <circle cx="35" cy="35" r="32" fill="#ffffff" stroke="#ef4444" stroke-width="8" />
      <text x="35" y="44" fill="#000000" font-size="24" font-weight="900" text-anchor="middle">50</text>
    </g>

    <!-- Speed Bar Indicator -->
    <rect x="25" y="230" width="310" height="12" rx="6" fill="#262626" />
    <rect x="25" y="230" width="220" height="12" rx="6" fill="#22c55e" />
  </g>

  <!-- MAIN HUD CENTER: CURRENT STREET & NEXT MANEUVER -->
  <g transform="translate(415, 95)">
    <rect x="0" y="0" width="410" height="260" rx="14" fill="#050505" stroke="#262626" stroke-width="2" />
    
    <!-- Current Street Tag -->
    <rect x="20" y="18" width="370" height="60" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <text x="35" y="38" fill="#bae6fd" font-size="10" font-weight="bold">VÍA ACTUAL AUTORIZADA</text>
    <text x="35" y="60" fill="#ffffff" font-size="17" font-weight="900">Avenida Alfonso X el Sabio</text>

    <!-- Next Turn Arrow & Instruction -->
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="370" height="145" rx="10" fill="#0a0a0a" stroke="#fbbf24" stroke-width="1.5" />
      
      <!-- Arrow Icon -->
      <g transform="translate(20, 25)">
        <circle cx="35" cy="45" r="32" fill="#fbbf24" />
        <path d="M 35 25 L 50 45 L 42 45 L 42 62 L 28 62 L 28 45 L 20 45 Z" fill="#000000" />
      </g>

      <text x="105" y="45" fill="#fbbf24" font-size="14" font-weight="bold">EN 80 METROS</text>
      <text x="105" y="75" fill="#ffffff" font-size="20" font-weight="900">Girar a la derecha</text>
      <text x="105" y="102" fill="#a3a3a3" font-size="13">hacia Av. Maisonnave (Carril Taxi)</text>
    </g>
  </g>

  <!-- MAIN HUD RIGHT: OFFICIAL TAXIMETER (TARIFA 1 & 2 CALCULATOR) -->
  <g transform="translate(845, 95)">
    <rect x="0" y="0" width="320" height="260" rx="14" fill="#050505" stroke="#fbbf24" stroke-width="2.5" />
    
    <!-- Meter Header -->
    <rect x="18" y="18" width="284" height="42" rx="8" fill="#fbbf24" />
    <text x="30" y="44" fill="#000000" font-size="14" font-weight="900">💶 TAXÍMETRO OFICIAL</text>
    <rect x="220" y="24" width="72" height="28" rx="6" fill="#000000" />
    <text x="256" y="43" fill="#fbbf24" font-size="12" font-weight="900" text-anchor="middle">T-1 DÍA</text>

    <!-- Big Fare Display -->
    <g transform="translate(18, 70)">
      <rect x="0" y="0" width="284" height="85" rx="8" fill="#0a0a0a" stroke="#333333" stroke-width="1.5" />
      <text x="15" y="28" fill="#737373" font-size="11">TOTAL ESTIMADO CARRERA</text>
      <text x="15" y="70" fill="#22c55e" font-size="44" font-weight="900" filter="url(#neonGlow)">11,40 €</text>
      <text x="210" y="70" fill="#737373" font-size="16">IVA inc.</text>
    </g>

    <!-- Breakdown Details -->
    <g transform="translate(18, 168)">
      <text x="0" y="18" fill="#a3a3a3" font-size="11">Bajada de Bandera: <tspan fill="#ffffff" font-weight="bold">2,15 €</tspan></text>
      <text x="0" y="38" fill="#a3a3a3" font-size="11">Distancia (7.8 km × 1,18 €): <tspan fill="#ffffff" font-weight="bold">9,25 €</tspan></text>
      <text x="0" y="58" fill="#a3a3a3" font-size="11">Ahorro Carril Bus: <tspan fill="#22c55e" font-weight="bold">-4.5 min (-2,10 €)</tspan></text>
      <text x="0" y="78" fill="#fbbf24" font-size="10">Regulado por Ayuntamiento de Alicante</text>
    </g>
  </g>

  <!-- BOTTOM GRID: 4 GIANT QUICK ACTION CARDS -->
  <g transform="translate(35, 375)">
    <!-- CARD 1: CRITICAL DEMAND RADAR (AVE RENFE & AIRPORT) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="270" height="260" rx="14" fill="#050505" stroke="#3b82f6" stroke-width="2" />
      <rect x="15" y="15" width="240" height="36" rx="8" fill="#1e3a8a" />
      <text x="25" y="38" fill="#93c5fd" font-size="12" font-weight="bold">✈️ RADAR DE DEMANDA</text>
      
      <!-- Influx item 1: AVE -->
      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="240" height="54" rx="8" fill="#0a0a0a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="22" fill="#ffffff" font-size="12" font-weight="bold">🚄 AVE Chamartín ➔ Alacant</text>
        <text x="12" y="42" fill="#22c55e" font-size="11">Llegada: 14:45 (+380 pasajeros)</text>
      </g>

      <!-- Influx item 2: Airport Altet -->
      <g transform="translate(15, 122)">
        <rect x="0" y="0" width="240" height="54" rx="8" fill="#0a0a0a" stroke="#1e293b" stroke-width="1" />
        <text x="12" y="22" fill="#ffffff" font-size="12" font-weight="bold">✈️ Aeropuerto El Altet</text>
        <text x="12" y="42" fill="#fbbf24" font-size="11">4 Vuelos Londres/Gatwick (15:10)</text>
      </g>

      <!-- Button -->
      <rect x="15" y="190" width="240" height="52" rx="10" fill="#3b82f6" />
      <text x="135" y="222" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🎯 IR A PARADA AVE</text>
    </g>

    <!-- CARD 2: CLOSEST TAXI STAND STATUS -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="270" height="260" rx="14" fill="#050505" stroke="#fbbf24" stroke-width="2" />
      <rect x="15" y="15" width="240" height="36" rx="8" fill="#78350f" />
      <text x="25" y="38" fill="#fde68a" font-size="12" font-weight="bold">🚖 PARADAS OFICIALES</text>

      <text x="15" y="78" fill="#a3a3a3" font-size="11">PARADA MÁS CERCANA (250 m):</text>
      <text x="15" y="105" fill="#ffffff" font-size="16" font-weight="900">Plaza de los Luceros</text>
      <text x="15" y="128" fill="#22c55e" font-size="13" font-weight="bold">🟢 6 Plazas Disponibles</text>
      <text x="15" y="150" fill="#737373" font-size="11">Tel. Teletaxi: 965 10 10 10</text>

      <!-- Fast Nav Button -->
      <rect x="15" y="190" width="240" height="52" rx="10" fill="#fbbf24" />
      <text x="135" y="222" fill="#000000" font-size="13" font-weight="900" text-anchor="middle">🧭 NAVEGAR A PARADA</text>
    </g>

    <!-- CARD 3: KEY DGT CAMERAS FAST ACCESS -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="270" height="260" rx="14" fill="#050505" stroke="#06b6d4" stroke-width="2" />
      <rect x="15" y="15" width="240" height="36" rx="8" fill="#0e7490" />
      <text x="25" y="38" fill="#a5f3fc" font-size="12" font-weight="bold">📹 CÁMARAS ACCESOS</text>

      <!-- Camera thumb preview -->
      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="240" height="116" rx="8" fill="#171717" stroke="#262626" stroke-width="1" />
        <rect x="8" y="8" width="224" height="74" rx="6" fill="#0a0a0a" />
        <text x="120" y="48" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Av. Dénia / Vía Parque (Fluido)</text>
        <text x="12" y="102" fill="#a3a3a3" font-size="10">DGT Cam #102 · Refresco en 4s</text>
      </g>

      <!-- Action Button -->
      <rect x="15" y="190" width="240" height="52" rx="10" fill="#06b6d4" />
      <text x="135" y="222" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">📺 VER MURO COMPLETO</text>
    </g>

    <!-- CARD 4: ALICANTE LOCAL CLOSURES & FIESTAS ALERTS -->
    <g transform="translate(870, 0)">
      <rect x="0" y="0" width="260" height="260" rx="14" fill="#050505" stroke="#ef4444" stroke-width="2" />
      <rect x="15" y="15" width="230" height="36" rx="8" fill="#7f1d1d" />
      <text x="25" y="38" fill="#fca5a5" font-size="12" font-weight="bold">⚠️ CORTES Y FIESTAS</text>

      <g transform="translate(15, 60)">
        <rect x="0" y="0" width="230" height="116" rx="8" fill="#0a0a0a" stroke="#262626" stroke-width="1" />
        <text x="10" y="22" fill="#ef4444" font-size="11" font-weight="bold">🔥 Hogueras / Mascletà</text>
        <text x="10" y="42" fill="#ffffff" font-size="11">Corte Plaza Luceros 12:00-15:00</text>
        <text x="10" y="65" fill="#f59e0b" font-size="11 font-weight=bold">🚧 Obras Rambla Méndez Núñez</text>
        <text x="10" y="85" fill="#a3a3a3" font-size="10">Desvío por Explanada de España</text>
      </g>

      <!-- Action Button -->
      <rect x="15" y="190" width="230" height="52" rx="10" fill="#ef4444" />
      <text x="130" y="222" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">🛡️ VER TODOS LOS CORTES</text>
    </g>
  </g>
</svg>
